name: CI - Tests and Coverage

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: ggimports_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test -d ggimports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/ggimports_test
      SECRET_KEY: github-actions-test-secret
      ALGORITHM: HS256
      ENVIRONMENT: test
      ALLOWED_ORIGINS: http://localhost:5173
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100