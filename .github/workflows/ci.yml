name: CI - Tests and Coverage

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: ggimports_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test -d ggimports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/ggimports_test
      SECRET_KEY: github-actions-test-secret
      ALGORITHM: HS256
      ENVIRONMENT: test
      ALLOWED_ORIGINS: http://localhost:5173
      RATE_LIMIT_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          python -m pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Check coverage targets
        run: |
          python scripts/check_coverage_thresholds.py

      - name: Check new code coverage on PR
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=85

      - name: Check new code coverage on push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          diff-cover coverage.xml \
            --compare-branch=${{ github.event.before }} \
            --fail-under=85