name: CI - Tests, Coverage and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: ggimports_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test -d ggimports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/ggimports_test
      SECRET_KEY: github-actions-test-secret
      ALGORITHM: HS256
      ENVIRONMENT: test
      ALLOWED_ORIGINS: http://localhost:5173
      RATE_LIMIT_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          python -m pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Check coverage targets
        run: |
          python scripts/check_coverage_thresholds.py

      - name: Check new code coverage on PR
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=85

      - name: Check new code coverage on push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          diff-cover coverage.xml \
            --compare-branch=${{ github.event.before }} \
            --fail-under=85


  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    # O deploy só começa se o job "tests" inteiro passar.
    needs: tests

    # Só faz deploy de commits enviados para a main.
    # Pull Requests executam testes, mas NÃO alteram produção.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Evita dois deploys simultâneos na mesma EC2.
    concurrency:
      group: gg-imports-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/gg_imports_deploy

          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/gg_imports_deploy

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.sha }}

        run: |
          ssh \
            -i ~/.ssh/gg_imports_deploy \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'EOF'

          set -euo pipefail

          DEPLOY_SHA="$1"

          APP_DIR="$HOME/gg-imports"
          CONTAINER_NAME="gg-imports-backend"

          echo "=========================================="
          echo "GG Imports - Deploy"
          echo "Commit: $DEPLOY_SHA"
          echo "=========================================="

          cd "$APP_DIR"

          echo ""
          echo "1. Verificando ambiente de produção..."

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado em $APP_DIR"
            exit 1
          fi

          echo ""
          echo "2. Baixando commit aprovado pelo CI..."

          git fetch origin main

          git reset --hard "$DEPLOY_SHA"

          echo ""
          echo "Commit presente na EC2:"
          git rev-parse HEAD

          echo ""
          echo "3. Salvando imagem atual para possível rollback..."

          if docker image inspect gg-imports-backend:latest >/dev/null 2>&1; then
            docker tag \
              gg-imports-backend:latest \
              gg-imports-backend:previous

            echo "Imagem anterior salva."
          else
            echo "Nenhuma imagem latest encontrada para rollback."
          fi

          echo ""
          echo "4. Construindo nova imagem Docker..."

          docker build \
            -t "gg-imports-backend:$DEPLOY_SHA" \
            .

          echo ""
          echo "5. Parando container atual..."

          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          echo ""
          echo "6. Iniciando nova versão..."

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file .env \
            -p 127.0.0.1:8000:8000 \
            "gg-imports-backend:$DEPLOY_SHA"

          echo ""
          echo "7. Aguardando aplicação iniciar..."

          HEALTHY=false

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health/ready \
              >/dev/null; then

              HEALTHY=true
              break

            fi

            echo "Tentativa $i/30..."
            sleep 2

          done

          if [ "$HEALTHY" = true ]; then

            echo ""
            echo "Health check OK."

            docker tag \
              "gg-imports-backend:$DEPLOY_SHA" \
              gg-imports-backend:latest

            echo ""
            echo "=========================================="
            echo "DEPLOY REALIZADO COM SUCESSO"
            echo "Commit: $DEPLOY_SHA"
            echo "=========================================="

            exit 0

          fi

          echo ""
          echo "=========================================="
          echo "ERRO: NOVA VERSAO NAO FICOU SAUDAVEL"
          echo "=========================================="

          echo ""
          echo "Logs da nova versão:"

          docker logs --tail 100 "$CONTAINER_NAME" || true

          echo ""
          echo "8. Executando rollback..."

          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          if docker image inspect gg-imports-backend:previous >/dev/null 2>&1; then

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file .env \
              -p 127.0.0.1:8000:8000 \
              gg-imports-backend:previous

            echo ""
            echo "Versão anterior restaurada."

          else

            echo ""
            echo "ERRO: nenhuma imagem anterior disponível para rollback."

          fi

          exit 1

          EOF